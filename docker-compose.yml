services:
  # ==========================================================
  # BAZA DE DATE - SQL Server 2022
  # ==========================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cosmetico-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CosmeticoSql!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"          # accesibil si din SSMS de pe host
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $$MSSQL_SA_PASSWORD -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================================
  # API - aplicatia ASP.NET Core
  # ==========================================================
  api:
    build: .
    container_name: cosmetico-api
    depends_on:
      db:
        condition: service_healthy   # porneste doar dupa ce SQL Server e gata
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CosmeticoDb;User Id=sa;Password=CosmeticoSql!2026;TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: "COSMETICO_cheie_docker_minim_32_caractere_2026!"
    ports:
      - "8080:8080"          # http://localhost:8080/swagger
    volumes:
      - product-images:/app/wwwroot/images   # imaginile uploadate supravietuiesc rebuild-urilor
      - api-logs:/app/logs                   # logurile Serilog persista in afara containerului

volumes:
  sqldata:
  product-images:
  api-logs:
